name: Deploy Frontend

on:
  workflow_run:
    workflows: ["ETL Weekly Data Refresh"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: 3.38.6
          cache: true

      - name: Download ETL artifact (workflow_run)
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: aggregate-data
          path: etl_artifacts
          if_no_artifact_found: fail

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Resolve remote assets base
        shell: bash
        run: |
          REMOTE_DIR="etl_artifacts/datos/metadata/remote_assets"
          REQUIRED_FILES=(
            "history_index.json"
            "trend_score_history.json"
            "technology_profiles.json"
            "home_highlights.json"
            "github_lenguajes_public.json"
            "github_frameworks_history.json"
            "github_correlacion_history.json"
            "so_volumen_history.json"
            "so_aceptacion_history.json"
            "so_tendencias_history.json"
            "reddit_sentimiento_public.json"
            "reddit_temas_history.json"
            "reddit_interseccion_history.json"
            "run_manifest.json"
          )

          if [ ! -d "$REMOTE_DIR" ]; then
            echo "Missing remote assets directory: $REMOTE_DIR"
            exit 1
          fi
          missing=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$REMOTE_DIR/$file" ]; then
              echo "Missing remote asset: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "REMOTE_ASSETS_BASE_URL=https://sam-24-dev.github.io/Technology-trend-analysis-platform/assets/data/" >> "$GITHUB_ENV"
          echo "Remote assets complete; enabling REMOTE_ASSETS_BASE_URL."

      - name: Build Flutter Web
        run: |
          cd frontend
          flutter build web --wasm --no-wasm-dry-run --no-web-resources-cdn --base-href "/Technology-trend-analysis-platform/" --dart-define=USE_HISTORY_BRIDGE_JSON=true --dart-define=REMOTE_ASSETS_BASE_URL=${REMOTE_ASSETS_BASE_URL}

      - name: Inject remote JSON assets
        shell: bash
        run: |
          set -e
          mkdir -p frontend/build/web/assets/data
          cp -f etl_artifacts/datos/metadata/remote_assets/*.json frontend/build/web/assets/data/
          echo "Remote assets injected from ETL artifact."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build/web
