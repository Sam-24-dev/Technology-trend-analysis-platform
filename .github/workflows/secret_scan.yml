name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect_secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run detect-secrets
        run: |
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          git ls-files -z | grep -zv '^\.secrets\.baseline$' | xargs -0r detect-secrets-hook --baseline .secrets.baseline
