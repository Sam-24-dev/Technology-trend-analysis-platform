name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect_secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0

      - name: Scan tracked files
        run: git ls-files -z | grep -zv -e '^\.secrets\.baseline$' -e '^datos/source_packages/reddit/receipt\.json$' | xargs -0r detect-secrets-hook --baseline .secrets.baseline

      - name: Scan optional Reddit receipt
        env:
          DIGEST_PATTERN: '^ *"sha256" ?[=:] "[0-9a-f]{64}",?$'
        run: |
          if [ -f datos/source_packages/reddit/receipt.json ]; then
            detect-secrets-hook --baseline .secrets.baseline --exclude-lines "$DIGEST_PATTERN" datos/source_packages/reddit/receipt.json
          fi

      - name: Check optional Reddit receipt identity
        run: |
          PYTHONPATH=backend python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          from reddit_source_package import validate_reddit_source_package

          root = Path.cwd()
          receipt_path = root / "datos/source_packages/reddit/receipt.json"
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              finished = datetime.fromisoformat(receipt["extraction_finished_at_utc"].replace("Z", "+00:00"))
              validate_reddit_source_package(root, receipt["source_date_utc"], now=finished)
          PY
